name: CI

# PR を main に向けた時に docker build の sanity check + cargo test を回す。
# push / deploy はしない (deploy は dev-release.yml + deploy.yml に分離)。

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test
        run: cargo test --all-features

  build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (sanity check)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            CARGO_BUILD_JOBS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/ohishi-exp/dtako-scraper:pr-${{ github.event.pull_request.number }}
