name: Deploy

# PR を main に向けたら、その PR のコミットを build → GHCR push → SSH で
# 自前 VPS の docker container を入れ替える (= PR がそのまま VPS に反映される
# preview deploy 兼ステージング)。reviewer は実動作を見て merge 可否を判断。
# 手動 dispatch (任意 ref) も残す (緊急の hotfix 再 deploy 用)。
#
# 参考: yhonda-ohishi-pub-dev/browser-render-rust の scripts/deploy-kagoya.sh。
# 機密 (DTAKO_ACCOUNTS / SMTP_*) は VPS 上の /opt/dtako-scraper/.env に置いたまま
# --env-file で渡り、CI / workflow YAML には一切載らない。

on:
  pull_request:
    branches: [main]
  # main への merge (push) では VPS への再 deploy はしない (PR 時点で既に preview
  # deploy 済みのため冗長)。それでも push トリガーを持たせるのは、Swatinem/
  # rust-cache の save-if (下記 test job) が `github.ref == 'refs/heads/main'`
  # を書き戻し条件にしており、push トリガーが無いと **一生キャッシュが更新
  # されない**バグがあったため (browser-render-rust の ci.yml は push: master
  # を持つのでこの問題が起きない、2026-07-01 に発覚・修正)。
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to build + deploy (branch / sha / tag)'
        required: false
        type: string
        default: main

# 全 job 共通 permissions:
# - contents: write       → auto-merge job (gh pr merge --squash --auto)
# - pull-requests: write  → disable-auto-merge + auto-merge jobs
# - packages: write       → GHCR push
permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/ohishi-exp/dtako-scraper
  CONTAINER_NAME: dtako-scraper
  VPS_APP_DIR: /opt/dtako-scraper

# 同時に複数 PR の deploy が走ると VPS 上の container を奪い合うので、
# repo 全体で 1 つに直列化する。新 PR push が来たら走行中の古い run は cancel。
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  # CI 開始時に PR の auto-merge を一旦 disable し、deploy 成功後に改めて queue
  # するパターン (branch protection が緩い repo での誤 merge 防止)。
  disable-auto-merge:
    name: Disable PR auto-merge (CI start)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Force-disable PR auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge --disable-auto "$PR_NUMBER" -R "$REPO" || true

  test:
    name: Cargo test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # rust-alc-api ci.yml と同パターンの sccache 配線
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dtako-scraper-test
          # cache 汚染防止: PR では既存 main cache を読むだけ、書き戻すのは main push 時のみ
          save-if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test
        run: cargo test --all-features

  build:
    name: Build + push image
    needs: test
    runs-on: ubuntu-latest
    # PR トリガーでも GHCR push できるよう明示的に再宣言
    # (org 設定 / repo の Default workflow permissions が Read-only でも
    # job-level の packages: write は workflow YAML で許可される)。
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR では pr-{number}-{short_sha} を image tag に使う
            SHORT=$(printf '%s' "$PR_HEAD_SHA" | cut -c1-7)
            TAG="pr-${PR_NUMBER}-${SHORT}"
          else
            # workflow_dispatch では選んだ ref の sha を使う
            SHORT=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
            TAG="manual-${SHORT}"
          fi
          # safety: docker tag 文字制限内 + 英数字 + - + _ + . のみ
          if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::invalid image tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Build tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CARGO_BUILD_JOBS=2
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH deploy to VPS
    # main への push (merge) では VPS deploy をしない — PR 時点で既にその commit が
    # preview deploy 済みのため冗長 (push トリガーの目的は test job のキャッシュ
    # 書き戻しのみ、上記 on: push のコメント参照)。
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAGOYA_VPS_SSH_KEY }}

      - name: Add VPS host key
        env:
          KAGOYA_VPS_HOST: ${{ secrets.KAGOYA_VPS_HOST }}
        run: |
          HOST="${KAGOYA_VPS_HOST##*@}"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy container on VPS
        env:
          KAGOYA_VPS_HOST: ${{ secrets.KAGOYA_VPS_HOST }}
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ needs.build.outputs.tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_DIR: ${{ env.VPS_APP_DIR }}
          # GITHUB_TOKEN は本 run 限り有効で `packages: read` を持つ。
          # これを VPS に渡せば VPS 側で `.env` に GHCR_TOKEN を置かなくても
          # docker pull できる (PR から fork でなければ常に発行される)。
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # NOTE: 値は step env: 経由で渡し、SSH コマンドブロックには直接
          # workflow expression を埋め込まない (command injection 防止)。
          ssh -o StrictHostKeyChecking=yes "$KAGOYA_VPS_HOST" \
              IMAGE="$IMAGE" \
              CONTAINER_NAME="$CONTAINER_NAME" \
              APP_DIR="$APP_DIR" \
              GHCR_TOKEN="$GHCR_TOKEN" \
              GHCR_USER="$GHCR_USER" \
              'bash -s' <<'REMOTE'
          set -e

          : "${IMAGE:?IMAGE required}"
          : "${CONTAINER_NAME:?CONTAINER_NAME required}"
          : "${APP_DIR:?APP_DIR required}"

          # CI 側 GITHUB_TOKEN で docker login (pull 用、本 run 限り有効)。
          # 未設定なら VPS の /opt/dtako-scraper/.env の GHCR_TOKEN を fallback で使う。
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-ohishi-exp}" --password-stdin >/dev/null
          elif [ -f "$APP_DIR/.env" ]; then
            FALLBACK_TOKEN=$(grep -E '^GHCR_TOKEN=' "$APP_DIR/.env" | cut -d= -f2-)
            if [ -n "$FALLBACK_TOKEN" ]; then
              echo "$FALLBACK_TOKEN" | docker login ghcr.io -u ohishi-exp --password-stdin >/dev/null
            else
              echo "no GHCR token (CI or .env); assuming docker is already logged in to GHCR"
            fi
          fi

          echo "Pulling $IMAGE ..."
          docker pull "$IMAGE"

          echo "Stopping existing container..."
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          echo "Starting new container..."
          mkdir -p "$APP_DIR/downloads"
          docker run -d \
              --name "$CONTAINER_NAME" \
              --restart=unless-stopped \
              --init \
              -p 127.0.0.1:8081:8080 \
              -v "$APP_DIR/downloads:/app/downloads" \
              --env-file "$APP_DIR/.env" \
              --shm-size=1g \
              --ulimit nofile=65536:65536 \
              --security-opt seccomp=unconfined \
              "$IMAGE"

          echo "Waiting for health check..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
              echo "Health check passed!"
              docker ps -f name="$CONTAINER_NAME"
              echo "Cleaning up old images..."
              docker image prune -af --filter 'until=24h' || true
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done

          echo "::error::Health check failed for $CONTAINER_NAME"
          docker logs --tail=200 "$CONTAINER_NAME" || true
          exit 1
          REMOTE

  auto-merge:
    name: Auto Merge
    needs: [test, build, deploy]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.deploy.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    # CROSS-ORG: ohishi-exp → ippoan は `secrets: inherit` で渡らないため明示渡し
    # (ci-workflows CLAUDE.md「auto-merge.yml クロス org caller」参照)。
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      TAG_RELEASE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
