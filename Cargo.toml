[workspace]
# crates/net780 (NET780 パーサー、pure lib) は host / wasm32 どちらでもビルド可能。
# ブラウザ向け wasm バインディングは ohishi-exp/net780-wasm (別 repo) が
# `net780 = { git = "https://github.com/ohishi-exp/dtako-scraper", path = "crates/net780" }`
# として本クレートを参照する (Refs #18)。
members = ["crates/net780"]
# default-members を明示しないと `cargo test` (deploy.yml、--workspace 無し) が
# root package だけを対象にし net780 のテストを静かにスキップしてしまうため、
# 明示的に両方を default に含める。
default-members = [".", "crates/net780"]

[package]
name = "dtako-scraper"
version = "0.1.0"
edition = "2021"
description = "Dtakolog CSV スクレイパー - theearth-np.com から csvdata.zip を取得"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }

# Browser automation (CDP)
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime", "_fetcher-native-tokio"] }
futures = "0.3"
tokio-stream = "0.1"

# HTTP client (file upload)
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# Config
dotenvy = "0.15"

# ZIP inspection (debug)
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"
